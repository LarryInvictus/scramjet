<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConvYH V2 — Browser</title>

  <link rel="stylesheet" href="/index.css" />
  <meta name="robots" content="noindex" />
  <script src="/bootstrap-init.js"></script>

  <style>
    :root {
      --bg: #050008;
      --accent: #a855ff;
      --accent-soft: #6b21ff;
    }

    body {
      margin: 0;
      background: var(--bg);
     bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .square {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(135deg, rgba(168, 85, 255, 0.18), rgba(107, 33, 255, 0.05));
      box-shadow: 0 0 25px rgba(168, 85, 255, 0.35);
      backdrop-filter: blur(4px);
      transition: transform 10s linear;
    }

    /* Header */
    .header {
      text-align: center;
      padding-top: 20px;
    }

    .title {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 25px rgba(168, 85, 255, 0.6);
      margin: 0;
    }

    .subtitle {
      text-align: center;
      font-size: 16px;
      opacity: 0.8;
      margin-top: 6px;
    }

    /* Search bar */
    .browser-bar {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .browser-input {
      width: 55%;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 255, 0.45);
      background: rgba(10, 0, 25, 0.55);
      color: #f9f5ff;
      font-size: 16px;
      outline: none;
      box-shadow: 0 0 12px rgba(168, 85, 255, 0.25);
      backdrop-filter: blur(6px);
    }

    .browser-input::placeholder {
      color: rgba(209, 196, 255, 0.6);
    }

    .browser-button {
      padding: 12px 26px;
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 255, 0.45);
      background: rgba(20, 0, 40, 0.55);
      color: #d8b4ff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(168, 85, 255, 0.35);
      backdrop-filter: blur(6px);
      transition: 0.2s ease;
    }

    .browser-button:hover {
      border-color: rgba(168, 85, 255, 0.8);
      box-shadow: 0 0 28px rgba(168, 85, 255, 0.6);
      color: #f0d9ff;
    }

    .browser-button:active {
      transform: scale(0.97);
      box-shadow: 0 0 12px rgba(168, 85, 255, 0.4);
    }

    /* Purple outlined frame (REAL FRAME) */
    .browser-frame {
      position: absolute;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      bottom: 10px;

      border-radius: 18px;
      border: 2px solid rgba(168, 85, 255, 0.45);
      background: rgba(10, 0, 25, 0.55);
      box-shadow: 0 0 30px rgba(168, 85, 255, 0.5);

      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .browser-url {
      padding: 8px 14px;
      font-size: 13px;
      color: rgba(226, 232, 240, 0.8);
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.6);
    }

    .browser-iframe {
      width: 100%;
      height: calc(100% - 32px);
      border: none;
      background: transparent;
    }
  </style>
</head>

<body>

  <!-- Background squares -->
  <div class="bg">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

  <!-- Header -->
  <div class="header">
    <h1 class="title">ConvYH V2</h1>
    <div class="subtitle">ConvYH V2 Proxy — powered by Scramjet.</div>
  </div>

  <!-- Search bar -->
  <form id="sj-form" class="browser-bar">
    <input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />
    <input id="sj-address" class="browser-input" type="text" placeholder="Enter a website URL..." />
    <button class="browser-button" type="submit">Go</button>
  </form>

  <!-- Purple outlined frame (REAL FRAME) -->
  <div class="browser-frame">
    <p id="sj-frame-url" class="browser-url"></p>
    <iframe id="sj-frame" class="browser-iframe"></iframe>
  </div>

  <!-- Scramjet logic -->
  <script src="/index.js"></script>

  <!-- ConvYH extras -->
  <script>
    // Floating squares
    const squares = document.querySelectorAll('.square');
    function randomMove(square) {
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      square.style.transform = `translate(${x}px, ${y}px)`;
    }
    squares.forEach(square => {
      randomMove(square);
      setInterval(() => randomMove(square), 8000);
    });

    // Enter key submits form
    const form = document.getElementById("sj-form");
    const address = document.getElementById("sj-address");
    address.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        form.submit();
      }
    });
  </script>

</body>
</html>
