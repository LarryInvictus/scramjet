<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ConvYH V2 - A free web proxy powered by Scramjet" />
  <meta name="robots" content="noindex" />
  <title>ConvYH V2 — Scramjet Proxy</title>

  <!-- Scramjet required -->
  <link rel="stylesheet" href="/index.css" />
  <script src="/bootstrap-init.js"></script>

  <style>
    :root {
      --bg: #050008;
      --accent: #a855ff;
      --accent-soft: #6b21ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #f9f5ff;
    }

    /* Background squares */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at top left, #1a0b33 0, #050008 45%, #000 100%);
      pointer-events: none;
    }

    .square {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(135deg, rgba(168, 85, 255, 0.18), rgba(107, 33, 255, 0.05));
      box-shadow: 0 0 25px rgba(168, 85, 255, 0.35);
      backdrop-filter: blur(4px);
      will-change: transform;
    }

    /* Centered header */
    .header {
      text-align: center;
      padding: 40px 20px 0;
    }

    .header h1 {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      text-shadow: 0 0 25px rgba(168, 85, 255, 0.6);
    }

    .desc {
      text-align: center;
      margin: 10px 20px;
      font-size: 18px;
      opacity: 0.8;
    }

    /* Search bar */
    #sj-form {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      padding: 0 20px;
    }

    #sj-address {
      width: 60%;
      max-width: 500px;
      padding: 14px 20px;
      border-radius: 999px;
      border: 1px solid rgba(168, 85, 255, 0.5);
      background: rgba(5, 0, 12, 0.9);
      color: #f9f5ff;
      font-size: 18px;
      outline: none;
      box-shadow: 0 0 0 1px rgba(107, 33, 255, 0.35);
      transition: all 0.3s ease;
    }

    #sj-address::placeholder {
      color: rgba(209, 196, 255, 0.6);
    }

    #sj-address:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168, 85, 255, 0.2);
    }

    /* Error text */
    .error-container {
      text-align: center;
      margin-top: 20px;
      padding: 0 20px;
    }

    #sj-error {
      color: #ff7b7b;
      font-size: 16px;
      margin: 0;
      min-height: 1.5em;
    }

    #sj-error-code {
      text-align: center;
      font-size: 14px;
      opacity: 0.7;
      margin-top: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      opacity: 0.6;
      font-size: 14px;
      margin-top: 20px;
    }

    /* Frame wrapper */
    #sj-frame-wrapper {
      margin-top: 30px;
      width: 100%;
      height: calc(100vh - 350px);
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }

    #sj-frame-url {
      padding: 10px 20px;
      font-size: 14px;
      color: rgba(209, 196, 255, 0.8);
      margin: 0;
      border-bottom: 1px solid rgba(168, 85, 255, 0.2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #sj-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: transparent;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: clamp(36px, 10vw, 48px);
      }

      #sj-address {
        width: min(90%, 400px);
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .square {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

  <main>
    <div class="header">
      <h1>ConvYH V2</h1>
    </div>

    <p class="desc">Welcome to the ConvYH V2 Proxy — powered by Scramjet.</p>

    <form id="sj-form" aria-label="Web proxy search">
      <input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" aria-hidden="true" />
      <input 
        id="sj-address" 
        type="text" 
        placeholder="Search the web freely"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search query"
      />
    </form>

    <div class="error-container" role="status" aria-live="polite">
      <div id="sj-error"></div>
      <pre id="sj-error-code" aria-label="Error details"></pre>
    </div>

    <footer>
      <p>ConvYH &copy; 2026</p>
    </footer>

    <div id="sj-frame-wrapper">
      <p id="sj-frame-url" aria-label="Current page URL"></p>
      <iframe 
        id="sj-frame"
        title="Proxied web content"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-pointer-lock"
        loading="lazy"
      ></iframe>
    </div>
  </main>

  <script src="/index.js" defer></script>

  <script>
    (function initializeBackgroundAnimation() {
      const squares = document.querySelectorAll('.square');
      
      function randomMove(square) {
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        square.style.transform = `translate(${x}px, ${y}px)`;
      }

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      
      if (!prefersReducedMotion) {
        squares.forEach(square => {
          randomMove(square);
          setInterval(() => randomMove(square), 8000);
        });
      }
    })();
  </script>
</body>
</html>
