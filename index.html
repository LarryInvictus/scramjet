<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConvYH V2 — Scramjet Proxy</title>

  <!-- Scramjet required -->
  <link rel="stylesheet" href="/index.css" />
  <meta name="robots" content="noindex" />
  <script src="/bootstrap-init.js"></script>

  <style>
    :root {
      --bg: #050008;
      --accent: #a855ff;
      --accent-soft: #6b21ff;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: #f9f5ff;
    }

    /* Background squares */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at top left, #1a0b33 0, #050008 45%, #000 100%);
    }

    .square {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(135deg, rgba(168, 85, 255, 0.18), rgba(107, 33, 255, 0.05));
      box-shadow: 0 0 25px rgba(168, 85, 255, 0.35);
      backdrop-filter: blur(4px);
      transition: transform 10s linear;
    }

    /* Centered header */
    .header {
      text-align: center;
      margin-top: 40px;
    }

    .header h1 {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 25px rgba(168, 85, 255, 0.6);
    }

    .desc {
      text-align: center;
      margin-top: 10px;
      font-size: 18px;
      opacity: 0.8;
    }

    /* Search bar */
    #sj-form {
      margin-top: 40px;
      display: flex;
      justify-content: center;
    }

    #sj-address {
      width: 60%;
      padding: 14px 20px;
      border-radius: 999px;
      border: 1px solid rgba(168, 85, 255, 0.5);
      background: rgba(5, 0, 12, 0.9);
      color: #f9f5ff;
      font-size: 18px;
      outline: none;
      box-shadow: 0 0 0 1px rgba(107, 33, 255, 0.35);
    }

    #sj-address::placeholder {
      color: rgba(209, 196, 255, 0.6);
    }

    /* Error text */
    #sj-error {
      text-align: center;
      margin-top: 20px;
      color: #ff7b7b;
      font-size: 16px;
    }

    #sj-error-code {
      text-align: center;
      font-size: 14px;
      opacity: 0.7;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 30px;
      opacity: 0.6;
      font-size: 14px;
    }

    /* Frame wrapper */
    #sj-frame-wrapper {
      margin-top: 30px;
      width: 100%;
      height: calc(100vh - 350px);
    }

    #sj-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>

<body>

  <!-- Background squares -->
  <div class="bg">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

  <!-- Header -->
  <div class="header">
    <h1>ConvYH V2</h1>
  </div>

  <div class="desc">
    Welcome to the ConvYH V2 Proxy — powered by Scramjet.
  </div>

  <!-- Scramjet form -->
  <form id="sj-form">
    <input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />
    <input id="sj-address" type="text" placeholder="Search the web freely" />
  </form>

  <div class="desc">
    <p id="sj-error"></p>
    <pre id="sj-error-code"></pre>
  </div>

  <footer>
    ConvYH &copy; 2026
  </footer>

  <!-- Frame -->
  <div id="sj-frame-wrapper">
    <p id="sj-frame-url"></p>
    <iframe id="sj-frame"></iframe>
  </div>

  <!-- Scramjet required -->
  <script src="/index.js"></script>

  <!-- Floating squares movement -->
  <script>
    const squares = document.querySelectorAll('.square');

    function randomMove(square) {
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      square.style.transform = `translate(${x}px, ${y}px)`;
    }

    squares.forEach(square => {
      randomMove(square);
      setInterval(() => randomMove(square), 8000);
    });
  </script>

</body>
</html>
